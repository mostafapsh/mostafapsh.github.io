backend:
  name: github
  repo: mostafapsh/mostafapsh.github.io
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "صفحات سایت"
    files:
      - name: "home"
        label: "صفحه اصلی"
        file: "content/home.md"
        fields:
          - { label: "عنوان سایت", name: "title", widget: "string" }
          - { label: "معرفی", name: "body", widget: "text" }
